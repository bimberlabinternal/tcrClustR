[project]
name = "tcrclustr-python-deps"
version = "0.0.0.9000"
description = "Python dependencies for tcrClustR R package"
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "scikit-learn>=0.23.0",
    "pandas>=1.1.0",
    "rpy2>=3.4.0",
    "tcrdist3>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
