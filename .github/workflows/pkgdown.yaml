name: Deploy pkgdown Documentation

on:
  # Trigger after R Build and Checks workflow completes on main branch
  workflow_run:
    workflows: ["R Build and Checks"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded (or if manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    container:
      image: ghcr.io/bimberlabinternal/tcrclustr:latest
      options: --user root
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set RETICULATE_PYTHON
        run: |
          PYTHON_PATH=$(which python3)
          echo "RETICULATE_PYTHON=${PYTHON_PATH}" >> $GITHUB_ENV
          echo "Using Python: ${PYTHON_PATH}"
      
      - name: Install pkgdown and dependencies
        run: |
          Rscript -e 'if (!require("pkgdown")) install.packages("pkgdown", repos="https://cloud.r-project.org")'
          Rscript -e 'if (!require("remotes")) install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never")'
      
      - name: Install package
        run: R CMD INSTALL .

      - name: Build pkgdown site
        run: |
          # global vs local might be needed b/c this is running as root:
          git config --global --add safe.directory /__w/tcrClustR/tcrClustR
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE, clean = TRUE)'
