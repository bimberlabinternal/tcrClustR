name: Deploy pkgdown Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-22.04
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RETICULATE_PYTHON: /usr/bin/python3
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: bimberlabinternal/DevOps/githubActions/r-gh-setup@master
        with:
          r_version: '4.4'
          bioc_version: '3.20'
          cache_version: ${{ secrets.CACHE_VERSION }}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            cmake
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user -r requirements.txt
      
      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("pkgdown", "devtools", "BiocManager"))'
          Rscript -e 'devtools::install_deps(dependencies = TRUE, upgrade = "never")'
      
      - name: Install package
        run: R CMD INSTALL .
      
      - name: Build pkgdown site
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE, clean = TRUE)'
