
name: R Build and Checks

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
  schedule:
    - cron: "0 6 10 * *"

jobs:
  # Build base image monthly (uses shared workflow from dockerDependencies)
  build-base:
    uses: GWMcElfresh/dockerDependencies/.github/workflows/build-base-image.yml@main
    permissions:
      contents: read
      packages: write
    secrets: inherit
  
  # Build and test with Docker caching (uses shared workflow from dockerDependencies)
  docker-build-and-test:
    needs: build-base
    if: always()  # Run even if base build is skipped 
    uses: GWMcElfresh/dockerDependencies/.github/workflows/docker-cache.yml@main
    with:
      r-version: '4.4.2'
      bioc-version: '3.20'
      python-version: '3.8.10'
      use-base-image: true
      # See: https://github.com/satijalab/seurat/issues/10180#event-3896304469 for background on fix/dimplot-data
      test-command: |
        Rscript -e "devtools::install_deps(dependencies = TRUE, upgrade = \"never\")" && \        
        Rscript -e "devtools::install_github(\"satijalab/seurat\", ref = \"fix/dimplot-data\", force = TRUE)" && \
        Rscript -e "devtools::test()" && \
        R CMD build . && \
        PKG=$(ls -1t *.tar.gz | head -n1) && \
        R CMD check "$PKG" --no-manual --no-build-vignettes
      push-images: true #updates the dependency cache images on branches
      push-runtime: ${{ github.ref == 'refs/heads/main' }} #only push runtime image on main branch
    permissions:
      contents: read
      packages: write
    secrets: inherit
